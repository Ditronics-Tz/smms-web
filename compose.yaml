# =============================================================================
# Podman Compose for SMMS Web (React SPA served by nginx)
# Frontend/API -> http://localhost:3000 (container :80)
# Usage (from Fedora WSL, in this directory):
#   podman compose -f compose.yaml build
#   podman compose -f compose.yaml up -d
#   podman compose -f compose.yaml ps
#   podman compose -f compose.yaml logs -f
#   podman compose -f compose.yaml down
# Requires: podman >= 4, podman-compose or podman compose plugin, .env file
# (copy .env.example -> .env and fill in Firebase values).
# The backend API is expected at http://127.0.0.1:8000 (see src/constant/api.ts).
# =============================================================================

services:
  smms-web:
    build:
      context: .
      dockerfile: Containerfile
      target: production
      args:
        - REACT_APP_FIREBASE_API_KEY=${REACT_APP_FIREBASE_API_KEY}
        - REACT_APP_FIREBASE_AUTH_DOMAIN=${REACT_APP_FIREBASE_AUTH_DOMAIN}
        - REACT_APP_FIREBASE_PROJECT_ID=${REACT_APP_FIREBASE_PROJECT_ID}
        - REACT_APP_FIREBASE_STORAGE_BUCKET=${REACT_APP_FIREBASE_STORAGE_BUCKET}
        - REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${REACT_APP_FIREBASE_MESSAGING_SENDER_ID}
        - REACT_APP_FIREBASE_APP_ID=${REACT_APP_FIREBASE_APP_ID}
        - REACT_APP_FIREBASE_MEASUREMENT_ID=${REACT_APP_FIREBASE_MEASUREMENT_ID}
        - REACT_APP_VAPID_KEY=${REACT_APP_VAPID_KEY}
        - NODE_ENV=production
    image: smms-web:prod
    container_name: smms-web-prod
    restart: unless-stopped
    ports:
      # localhost-only: nginx :8080 inside -> host :3000
      - "127.0.0.1:3000:8080"
    networks:
      - smmsweb_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

networks:
  smmsweb_network:
    driver: bridge
